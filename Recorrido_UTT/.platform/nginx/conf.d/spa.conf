## Archivo para Elastic Beanstalk (Amazon Linux 2)
# Redirige las rutas desconocidas al `index.html` para soportar SPA (Angular/Ionic)
# Con soporte PWA (service worker, manifest, installable)

# Security headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# PWA - Service Worker sin cache
location = /ngsw-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# PWA - Manifest sin cache
location = /manifest.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# index.html - sin cache para cambios frecuentes
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# Assets (JS, CSS) con hash en nombre - cache largo
location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Imágenes y medios - cache moderado
location ~* \.(?:jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=2592000";
}

# SPA routing - todas las rutas desconocidas al index.html
location / {
    try_files $uri $uri/ /index.html;
}
